<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08030f" />
  <title>PonyFlix</title>
  <meta name="description" content="PonyFlix — sua magia, quando quiser." />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Splash -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <h1 class="logo">PONY<span>FLIX</span></h1>
      <div class="logo-line"></div>
      <p class="tagline">&#10022;&nbsp;&nbsp;Sua magia, quando quiser&nbsp;&nbsp;&#10022;</p>
      <p class="loading" id="loading">carregando</p>
      <p class="by">By: <span>ScaryHollow</span></p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <header class="header">
      <button id="backBtn" class="back-btn hidden" aria-label="Voltar">&#8249;</button>
      <h2 id="headerTitle" class="header-title">PONYFLIX</h2>
      <span class="header-spacer"></span>
    </header>

    <main id="view" class="view"></main>

    <footer class="footer">
      <a class="footer-link" href="animes.html">🌸 Animes</a>
      <span class="credit">By:&nbsp;<b>ScaryHollow</b></span>
    </footer>
  </div>

  <!-- Player overlay -->
  <div id="player" class="player hidden">
    <div class="player-top">
      <button id="playerBack" class="back-btn">&#8249; Voltar</button>
      <span id="playerTitle" class="player-title"></span>
      <div id="audioSel" class="audio-sel"></div>
      <google-cast-launcher id="castBtn" class="cast-btn"></google-cast-launcher>
      <div class="player-nav">
        <button id="prevEp" class="nav-btn">Anterior</button>
        <button id="nextEp" class="nav-btn">Pr&oacute;ximo</button>
      </div>
    </div>
    <div class="player-frame">
      <iframe id="videoFrame" allowfullscreen allow="autoplay; fullscreen; encrypted-media" referrerpolicy="no-referrer"></iframe>
      <div id="castPanel" class="cast-panel hidden">
        <div class="cast-ico">&#128250;</div>
        <p class="cast-msg">Transmitindo na TV</p>
        <p id="castEp" class="cast-ep"></p>
        <p id="castStatus" class="cast-status"></p>
      </div>
    </div>
  </div>

  <script src="episodios.js"></script>
  <script>window.APP_CONFIG = { homeTitle: "PONYFLIX", seasonCovers: true };</script>
  <script src="app.js"></script>
  <!-- Cast SDK por último: app.js já definiu window.__onGCastApiAvailable -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
